name: CI

# Her push ve pull request'te: API testleri, arayüz testleri, gerçek veritabanıyla duman testi.
# main'e girince API imajı GitHub Container Registry'ye (ghcr.io) yüklenir.
# Render, "autoDeployTrigger: checksPass" sayesinde ancak bu kontroller geçince canlıya alır.
on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için yeni bir çalıştırma başlarsa eskisini iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (derle + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Derle ve test et
        run: dotnet test GorevTakip.Tests --configuration Release

      # Modele alan eklenip migration üretilmediyse (canlıda "column does not exist" olurdu) burada yakalanır.
      # Komut veritabanına bağlanmaz; ayarlar yalnızca uygulamanın kurulabilmesi için gerekli.
      - name: Migration modelle uyumlu mu?
        env:
          ConnectionStrings__Default: Host=localhost;Database=ci;Username=ci;Password=ci
          Jwt__Key: ci-icin-uretilmis-gecici-anahtar-0123456789-abcdef
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project GorevTakip

  ui:
    name: Arayüz (lint + test + build + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gorevtakip-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gorevtakip-ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Playwright tarayıcısını kur
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Test raporunu sakla (başarısızsa)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: gorevtakip-ui/playwright-report
          retention-days: 7

  docker-smoke:
    name: Docker (imajlar + gerçek veritabanıyla duman testi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Geçici ayarları oluştur
        run: |
          {
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "POSTGRES_DB=gorevtakip"
            echo "JWT_KEY=$(openssl rand -base64 48)"
          } > .env

      - name: Üretim compose dosyası (sunucu kurulumu) geçerli mi?
        run: SITE_ADDRESS=ci.example.com docker compose -f docker-compose.prod.yml config --quiet

      - name: Veritabanı + API + arayüzü ayağa kaldır
        run: docker compose up -d --build

      - name: Arayüz sunuluyor mu?
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8080/ | grep -q '<div id="root">' && exit 0
            sleep 1
          done
          echo "Arayüz 30 saniyede cevap vermedi" >&2
          exit 1

      - name: Gerçek API'ye duman testi
        run: ./scripts/smoke-test.sh http://localhost:5291 http://localhost:8080

      - name: Hata olursa konteyner günlükleri
        if: failure()
        run: docker compose logs --no-color

      - name: Temizle
        if: always()
        run: docker compose down -v

  publish-api-image:
    name: API imajını ghcr.io'ya yükle
    # Yalnızca main'e girişte ve her şey yeşilse
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, ui, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Depo sahibinin adında büyük harf olabilir; imaj adları küçük harf olmak zorunda, bu eylem düzeltir
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ./GorevTakip
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
