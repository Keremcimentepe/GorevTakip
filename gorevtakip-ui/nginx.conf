server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # "add_header" kullanan bir location, server düzeyindeki başlıkları devralmaz; bu yüzden
  # aşağıdaki location'larda önbellek için add_header değil `expires` kullanıyoruz.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Vite, dosya adlarına içerik özeti ekler (index-3f2a1b.js): değişince adı da değişir,
  # bu yüzden bir yıl boyunca önbelleğe alınabilir.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # index.html her seferinde sunucuya sorulsun (yeni sürüm hemen görünsün)
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
